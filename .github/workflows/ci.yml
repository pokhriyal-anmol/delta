name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Unit tests, both flavors
        run: ./gradlew testDirectDebugUnitTest testPlayDebugUnitTest
      - name: Build the debug APK
        run: ./gradlew assembleDirectDebug
      - uses: actions/upload-artifact@v4
        with:
          name: delta-direct-debug
          path: app/build/outputs/apk/direct/debug/app-direct-debug.apk

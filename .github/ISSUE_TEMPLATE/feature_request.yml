name: Feature request
description: Suggest something for Delta
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Delta is F1 only, has no server and does no background work. Requests that need those
        (live timing alerts, other series, accounts) are out of scope. See CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see
    validations:
      required: true

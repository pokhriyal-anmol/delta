*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;
 background:#0A0A0C;min-height:100vh;display:flex;flex-direction:column;align-items:center;
 padding:28px 16px;gap:16px;transition:background .25s;}
body.lt{background:#DDDDD8;}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:760px;}
.bar button{font:500 12px/1 inherit;padding:8px 13px;border-radius:999px;border:0;cursor:pointer;
 background:#1E1E24;color:#C5C5C5;transition:.15s;}
.bar button:hover{background:#2A2A32;}
.bar button.on{background:#D71921;color:#fff;}
body.lt .bar button{background:#fff;color:#555;}
body.lt .bar button.on{background:#D71921;color:#fff;}
.hint{font:400 11px/1.5 inherit;color:#6A6A70;text-align:center;max-width:560px;}
body.lt .hint{color:#77776E;}

#phone{width:390px;height:844px;border-radius:52px;overflow:hidden;position:relative;
 border:0.5px solid #2A2A32;flex-shrink:0;}
body.lt #phone{border-color:#C4C4BC;}
#scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
#scroll::-webkit-scrollbar{display:none;}

.cbD{background-color:#0B0B0D;background-image:
 repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px),
 repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),
 repeating-linear-gradient(45deg,#23232B 0 3px,#14141A 3px 6px);}
.cbL{background-color:#E9E9E5;background-image:
 repeating-linear-gradient(135deg,rgba(0,0,0,.055) 0 1px,transparent 1px 3px),
 repeating-linear-gradient(45deg,rgba(0,0,0,.028) 0 1px,transparent 1px 3px),
 repeating-linear-gradient(45deg,#DBDBD5 0 3px,#EFEFEB 3px 6px);}
.bignum{font-size:200px;font-weight:800;letter-spacing:-12px;line-height:1;
 -webkit-background-clip:text;background-clip:text;color:transparent;position:relative;}
.bigeng{position:absolute;left:0;right:0;top:4px;font-size:200px;font-weight:800;
 letter-spacing:-12px;line-height:1;}
.duo{width:100%;height:100%;object-fit:contain;object-position:bottom center;display:block;
 image-rendering:auto;}
.hero{-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 62%,rgba(0,0,0,.72) 82%,rgba(0,0,0,.18) 94%,transparent 100%);
 mask-image:linear-gradient(to bottom,#000 0%,#000 62%,rgba(0,0,0,.72) 82%,rgba(0,0,0,.18) 94%,transparent 100%);}
.duowrap{position:relative;}
.circ{border-radius:50%;overflow:hidden;}
.tapc{cursor:pointer;transition:transform .12s;}
.tapc:active{transform:scale(.975);}
</style>

  f+=`<filter id="${fid(d.t)}" color-interpolation-filters="sRGB">

/* Fake 3D by extruding: redraw the path down the y axis, dark to light,
   then lay the running surface on top. Depth ~9 reads solid without mush. */
function circuit3d(depth){
 const p=S();let s="";
 for(let i=depth;i>=1;i--){
  const t=i/depth;
  s+=`<path d="${SPA_D}" fill="none" stroke="${p.t3d}" stroke-opacity="${(0.30+0.70*(1-t)).toFixed(2)}"
   stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,${i*1.15})"/>`;
 }
 s+=`<path d="${SPA_D}" fill="none" stroke="${p.tBase}" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>`;
 s+=`<path d="${SPA_D}" fill="none" stroke="${p.tMain}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
 s+=`<path d="${SPA_ER}" fill="none" stroke="${ACC}" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>`;
 s+=`<circle cx="42.7" cy="78" r="4" fill="${p.txt}"/>`;
 return s;
}

 <div style="font-size:11px;color:${p.sec};letter-spacing:.4px;">2026 SEASON · ${d.t.toUpperCase()}</div>

 <div style="font-size:38px;font-weight:800;color:${col};letter-spacing:-1.5px;line-height:1.04;">${d.l}</div></div></div>
 <div style="margin:22px 20px 0;background:${p.card};border-radius:26px;padding:17px 10px;box-shadow:${p.sh};display:flex;">
 ${sc(d.w,"WINS")}${sc(d.pod,"PODIUMS")}${sc(d.pole,"POLES")}${sc(d.dnf,"DNFs")}</div>
 <div style="padding:24px 22px 0;display:flex;justify-content:space-between;align-items:baseline;">
 <span style="font-size:21px;font-weight:800;color:${p.txt};letter-spacing:-.6px;">Results</span>
 <div class="tapc" onclick="go('h2h')" style="display:inline-flex;align-items:center;gap:6px;background:${p.nav};border-radius:999px;padding:8px 14px;box-shadow:${p.shSm};">
 <i class="ti ti-swords" style="font-size:14px;color:${ACC};"></i>
 <span style="font-size:12px;font-weight:500;color:${p.txt};">Head to head</span></div></div>
 <div style="margin:14px 20px 0;background:${p.card};border-radius:26px;padding:17px 18px 15px;box-shadow:${p.sh};">
 <div style="display:flex;align-items:flex-end;gap:5px;height:64px;">${bars}</div>
 <div style="display:flex;justify-content:space-between;margin-top:9px;">
 <span style="font-size:10px;color:${p.sec};">R1</span>
 <span style="font-size:10px;color:${p.sec};">Points per round</span>
 <span style="font-size:10px;color:${p.sec};">R9</span></div></div>
 <div style="height:30px;"></div>${tabbar()}</div></div>`;}

/* ---------- H2H ---------- */
function h2h(){const p=S();const a=D[0],b=D[1];const ca=tc(a.t),cb=tc(b.t);
 const row=(l,va,vb)=>{const t=va+vb||1;const pa=Math.round(va/t*100);
  return `<div style="padding:13px 0;border-bottom:.5px solid ${p.div};">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
  <span style="font-size:17px;font-weight:700;color:${va>=vb?p.txt:p.sec};">${va}</span>
  <span style="font-size:10px;color:${p.sec};letter-spacing:.4px;">${l}</span>
  <span style="font-size:17px;font-weight:700;color:${vb>=va?p.txt:p.sec};">${vb}</span></div>
  <div style="display:flex;height:5px;border-radius:3px;overflow:hidden;background:${p.chip};">
  <div style="width:${pa}%;background:${ca};"></div><div style="flex:1;background:${cb};opacity:.75;"></div></div></div>`;};
 return `<div style="position:relative;min-height:844px;">${glow(-90,-110,380,p.ga)}
 <div style="position:relative;">${status()}${back('driver')}
 <div style="padding:20px 22px 0;">
 <div style="font-size:12px;color:${p.sec};letter-spacing:.3px;">Teammates · 2026</div>
 <div style="font-size:42px;font-weight:800;color:${p.txt};letter-spacing:-1.7px;line-height:1.02;margin-top:8px;">Head<br>to head</div></div>
 <div style="display:flex;gap:10px;padding:26px 20px 0;">
 <div style="flex:1;background:${p.card};border-radius:24px;padding:16px 14px;box-shadow:${p.sh};text-align:center;">
 <div class="circ" style="width:70px;height:70px;margin:0 auto;background:${ca}22;">
 ${heroImg(a,"","object-position:top center;transform:scale(1.35) translateY(6%);")}</div>
 <div style="font-size:15px;font-weight:700;color:${p.txt};margin-top:10px;">${a.l}</div>
 <div style="font-size:10px;color:${p.sec};margin-top:2px;">#${a.n}</div></div>
 <div style="display:flex;align-items:center;"><span style="font-size:12px;color:${p.sec};font-weight:600;">VS</span></div>
 <div style="flex:1;background:${p.card};border-radius:24px;padding:16px 14px;box-shadow:${p.sh};text-align:center;">
 <div class="circ" style="width:70px;height:70px;margin:0 auto;background:${cb}22;">
 ${heroImg(b,"","object-position:top center;transform:scale(1.35) translateY(6%);")}</div>
 <div style="font-size:15px;font-weight:700;color:${p.txt};margin-top:10px;">${b.l}</div>
 <div style="font-size:10px;color:${p.sec};margin-top:2px;">#${b.n}</div></div></div>
 <div style="margin:24px 20px 0;background:${p.card};border-radius:28px;padding:6px 20px 14px;box-shadow:${p.sh};">
 ${row("POINTS",a.pts,b.pts)}${row("WINS",a.w,b.w)}${row("PODIUMS",a.pod,b.pod)}
 ${row("POLES",a.pole,b.pole)}${row("QUALI H2H",6,3)}${row("RACE H2H",6,3)}</div>
 <div style="padding:22px 22px 0;"><span style="font-size:21px;font-weight:800;color:${p.txt};letter-spacing:-.6px;">Qualifying gap</span></div>
 <div style="margin:14px 20px 0;background:${p.card};border-radius:26px;padding:18px;box-shadow:${p.sh};">
 <div style="font-size:34px;font-weight:800;color:${p.txt};letter-spacing:-1.4px;line-height:1;">+0.084<span style="font-size:13px;font-weight:500;color:${p.sec};margin-left:5px;">S</span></div>
 <div style="font-size:11px;color:${p.sec};margin-top:6px;">Antonelli's median advantage over 9 rounds</div></div>
 <div style="height:30px;"></div>${tabbar()}</div></div>`;}

/* ---------- CONSTRUCTOR ---------- */
const CINFO={Mercedes:{full:"Mercedes-AMG Petronas",base:"Brackley, UK",pu:"Mercedes",since:1954,champs:8,slug:"mercedes"},
 Ferrari:{full:"Scuderia Ferrari",base:"Maranello, Italy",pu:"Ferrari",since:1950,champs:16,slug:"ferrari"},
 McLaren:{full:"McLaren Formula 1 Team",base:"Woking, UK",pu:"Mercedes",since:1966,champs:9,slug:"mclaren"},
 "Red Bull":{full:"Oracle Red Bull Racing",base:"Milton Keynes, UK",pu:"Red Bull Ford",since:2005,champs:6,slug:"red-bull-racing"}};
let curCon="Mercedes";
function openCon(t){curCon="Red Bull"===t?"Red Bull":t;go('constructor');}

function constructor_(){const p=S();const t=curCon;const col=tc(t);
 const inf=CINFO[t]||{full:t,base:"—",pu:"—",since:"—",champs:0,slug:""};
 const ds=D.filter(d=>d.t===t);
 const pts=CON.find(c=>c[0]===t)?.[1]||0;
 const pos=CON.findIndex(c=>c[0]===t)+1;
 const wins=ds.reduce((a,d)=>a+d.w,0), pods=ds.reduce((a,d)=>a+d.pod,0), poles=ds.reduce((a,d)=>a+d.pole,0);
 const logo=`https://media.formula1.com/content/dam/fom-website/teams/2025/${inf.slug}-logo.png`;
 const sc=(v,l)=>`<div style="flex:1;text-align:center;">
 <div style="font-size:23px;font-weight:800;color:${p.txt};line-height:1;">${String(v).padStart(2,"0")}</div>
 <div style="font-size:9px;color:${p.sec};margin-top:5px;letter-spacing:.4px;">${l}</div></div>`;
 const meta=(ic,k,v)=>`<div style="display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:.5px solid ${p.div};">
 <i class="ti ti-${ic}" style="font-size:17px;color:${p.sec};width:19px;"></i>
 <span style="flex:1;font-size:12px;color:${p.sec};">${k}</span>
 <span style="font-size:13px;font-weight:500;color:${p.txt};">${v}</span></div>`;
 let h=`<div style="position:relative;min-height:844px;"><div style="position:relative;">${status()}${back('standings')}
 <div style="position:relative;height:398px;margin-top:-6px;">
 <div style="position:absolute;left:50%;transform:translateX(-50%);top:26px;width:330px;height:330px;border-radius:50%;background:radial-gradient(circle, ${col}55 0%, ${p.gEnd} 68%);"></div>

 <div style="position:absolute;left:0;right:0;top:14px;text-align:center;">
 <div class="bigeng" style="color:${p.eng};font-size:150px;letter-spacing:-8px;">${String(pos).padStart(2,"0")}</div>
 <div class="bignum ${p.cb}" style="font-size:150px;letter-spacing:-8px;-webkit-text-stroke:3px ${p.nStroke};
  filter:drop-shadow(0 0 16px rgba(210,210,230,.12)) drop-shadow(0 0 46px ${col}55);">${String(pos).padStart(2,"0")}</div></div>

 <div style="position:absolute;left:0;right:0;top:120px;display:flex;justify-content:center;gap:0;">`;
 ds.slice(0,2).forEach((d,i)=>{h+=`<div class="tapc" onclick="openDriver(${D.indexOf(d)})" style="width:150px;height:196px;position:relative;${i?'margin-left:-26px;':''}">
  ${heroImg(d,"hero","object-position:bottom center;")}
  <div style="position:absolute;left:0;right:0;bottom:-2px;text-align:center;">
  <div style="font-size:11px;font-weight:700;color:${p.txt};">${d.l}</div>
  <div style="font-size:9px;color:${p.sec};margin-top:1px;">#${d.n} · ${d.pts} PTS</div></div></div>`;});
 h+=`</div>

 <div style="position:absolute;left:16px;top:206px;text-align:center;width:60px;">
 <div style="font-size:38px;font-weight:800;color:${p.txt};letter-spacing:-1.6px;line-height:1;">${pts}</div>
 <div style="font-size:10px;color:${p.sec};margin-top:6px;letter-spacing:.6px;">PTS</div></div>
 <div style="position:absolute;right:16px;top:206px;text-align:center;width:60px;">
 <div style="font-size:38px;font-weight:800;color:${p.txt};letter-spacing:-1.6px;line-height:1;">${inf.champs}</div>
 <div style="font-size:10px;color:${p.sec};margin-top:6px;letter-spacing:.6px;">TITLES</div></div>

 <div style="position:absolute;left:0;right:0;bottom:2px;text-align:center;">
 <div style="font-size:11px;color:${p.sec};letter-spacing:.4px;">CONSTRUCTOR · 2026</div>
 <div style="font-size:40px;font-weight:800;color:${col};letter-spacing:-1.6px;line-height:1.04;margin-top:5px;">${t}</div>
 <div style="font-size:12px;color:${p.sec};margin-top:5px;">${inf.full}</div></div></div>

 <div style="margin:22px 20px 0;background:${p.card};border-radius:26px;padding:17px 10px;box-shadow:${p.sh};display:flex;">
 ${sc(wins,"WINS")}${sc(pods,"PODIUMS")}${sc(poles,"POLES")}${sc(ds.reduce((a,d)=>a+d.dnf,0),"DNFs")}</div>

 <div style="margin:16px 20px 0;background:${p.card};border-radius:26px;padding:4px 20px 6px;box-shadow:${p.sh};">
 ${meta("engine","Power unit",inf.pu)}${meta("map-pin","Base",inf.base)}
 ${meta("calendar","In F1 since",inf.since)}
 <div style="display:flex;align-items:center;gap:11px;padding:11px 0;">
 <i class="ti ti-palette" style="font-size:17px;color:${p.sec};width:19px;"></i>
 <span style="flex:1;font-size:12px;color:${p.sec};">Livery</span>
 <img src="${logo}" alt="" style="height:17px;opacity:.9;" onerror="this.style.display='none'">
 <div style="width:22px;height:12px;border-radius:3px;background:${col};margin-left:9px;"></div></div></div>

 <div style="padding:22px 22px 0;"><span style="font-size:21px;font-weight:800;color:${p.txt};letter-spacing:-.6px;">Points per round</span></div>
 <div style="margin:14px 20px 0;background:${p.card};border-radius:26px;padding:17px 18px 15px;box-shadow:${p.sh};">
 <div style="display:flex;align-items:flex-end;gap:5px;height:64px;">`;
 [30,43,25,38,44,18,41,47,32].forEach(v=>{h+=`<div style="flex:1;height:${Math.round(v/47*100)}%;background:${col};border-radius:3px 3px 0 0;opacity:${(0.42+v/47*0.55).toFixed(2)};"></div>`;});
 h+=`</div><div style="display:flex;justify-content:space-between;margin-top:9px;">
 <span style="font-size:10px;color:${p.sec};">R1</span>
 <span style="font-size:10px;color:${p.sec};">Both cars combined</span>
 <span style="font-size:10px;color:${p.sec};">R9</span></div></div>
 <div style="height:30px;"></div>${tabbar()}</div></div>`;
 return h;}

/* ---------- ROUTER ---------- */
const SC={home,weekend,result,standings,cal,driver,constructor:constructor_,h2h};
const LBL={home:"Tab home",weekend:"Race weekend",result:"Race result",standings:"Standings",
 cal:"Calendar",driver:"Driver",constructor:"Constructor",h2h:"Head to head"};
const HINTS={home:"F-01 · F-02 · F-03 — countdown is real: Belgian GP is Sunday 19 July.",
 weekend:"F-01 — circuit stats + session schedule. Track shape is approximate; MultiViewer's circuit_info_url has real geometry for all 22.",
 result:"F-04 · F-07 — full classification with DNF reasons. 22 rows, compact density.",
 standings:"F-02 · F-03 — real standings after Round 9. Tap any driver.",
 cal:"F-09 — all 22 rounds. Past dimmed, next accented, future neutral.",
 driver:"F-12 — real headshot from F1's CDN, duotoned to team_colour. Number glows in team colour too.",
 constructor:"F-13 — livery hero not possible: F1 publishes no 2026 car art, and 2025 is 465x139 with no alpha. Hero is both drivers + championship position instead.",
 h2h:"F-11 — the one I said to build. Pure local computation, zero extra API cost."};

function go(s){screen=s;render();el('scroll').scrollTop=0;}
function render(){
 const p=S();
 el('phone').style.background=p.canvas;
 el('scroll').innerHTML=duoDefs()+SC[screen]();
 el('hint').textContent=HINTS[screen]||"";
 el('nav').innerHTML=Object.keys(SC).map(k=>
  `<button class="${screen===k?'on':''}" onclick="go('${k}')">${LBL[k]}</button>`).join("")
  +`<button onclick="tog()">${mode==='dark'?'☾ Dark':'☀ Light'}</button>`;
}
function tog(){mode=mode==='dark'?'light':'dark';document.body.classList.toggle('lt',mode==='light');render();}
render();
</script>
</body>
</html>
